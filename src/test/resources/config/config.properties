# Default framework configuration.
# Every key can be overridden with a system property, e.g. mvn test -Dbrowser=firefox -Dheadless=false
# No implicit wait setting on purpose: the framework uses explicit waits only.

# chrome (alias: chromium) | firefox | edge
browser=chrome
headless=true

# Active environment; selects <env>.baseUrl below
env=test

# Leave empty to use <env>.baseUrl; set (or pass -DbaseUrl) to force a URL
baseUrl=

# Accept untrusted TLS certificates (the test environment's certificate is not publicly trusted)
acceptInsecureCerts=true

explicitWaitSeconds=10
pageLoadTimeoutSeconds=30
# <width>,<height>
windowSize=1920,1080

# Base URL per environment
test.baseUrl=https://10.20.3.66/innovation-portal
